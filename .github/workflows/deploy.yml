name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_TOKEN DEPLOY_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name in this GitHub environment"
              exit 1
            fi
          done
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Set up Go when Wasm is present
        if: ${{ hashFiles('wasm/country/go.mod') != '' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: wasm/country/go.mod
          cache-dependency-path: wasm/country/go.mod
      - name: Test Go country classification
        if: ${{ hashFiles('wasm/country/go.mod') != '' }}
        working-directory: wasm/country
        run: go test ./...
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build and deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: pnpm run deploy production
      - name: Check deployed pages, API, and WebSocket
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: pnpm smoke
